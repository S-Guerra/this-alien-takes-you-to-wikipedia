<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>This alien takes you to Wikipedia</title>
	<link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<!-- partial:index.partial.html -->
	<div id="rocket" class="rocket-wrapper random">
		<div class="body-wrapper">
			<div class="rocket body">
				<div class="window">
					<div class="alien">
						<div class="alien head top"></div>
						<div class="alien head bottom"></div>
						<div class="alien eye right"></div>
						<div class="alien eye left"></div>
						<div class="alien body"></div>
					</div>
				</div>
				<div class="stripe">
					<img id="wiki-w" alt="Wikipedia's W"
						src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Wikipedia%27s_W.svg/128px-Wikipedia%27s_W.svg.png?20250314000201"
						decoding="async">
				</div>
			</div>
			<div class="lower-body"></div>
		</div>
		<div class="fin-wrapper">
			<div class="rocket fin"></div>
			<div class="rocket fin"></div>
			<div class="rocket fin"></div>
		</div>
		<div class="fire hider"></div>
		<div class="fire flame yellow hidden"></div>
		<div class="fire flame orange hidden"></div>
		<div class="fire flame red hidden"></div>
	</div>
	<hr class="random">
	<p class="random">Click the rocketship for a random article</p>
	<p class="random">or</p>
	<div>
		<input id="search-input" placeholder="Search for an article" />
		<button id="search-button">🔍</button>
		<button id="reset-button" class="hidden">❌</button>
	</div>
	<div id="result-list"></div>
	<!-- partial -->
	<script src="./script.js"></script>

</body>

</html>
